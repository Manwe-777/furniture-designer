name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The geometry is the product, so the tests are the gate: exact panel
      # sizes, no overlapping placements, kerf respected, and a nesting yield
      # that cannot silently regress.
      - run: npm test

      - run: npm run typecheck

      - run: npm run build
